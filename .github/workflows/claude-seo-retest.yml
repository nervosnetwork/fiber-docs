name: Claude SEO results reassessment November 16

on:
  push:
    branches: [codex/seo-outcomes-retest-20261116]

permissions:
  contents: read

concurrency:
  group: claude-seo-retest-20261116
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        site: [fiber, nervos, ckba]
    name: Public evidence - ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_PROXY: '*'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare exact tool version and isolated runtime
        run: |
          set -euo pipefail
          seo_task_dir="$RUNNER_TEMP/claude-seo-retest"
          mkdir -p "$seo_task_dir" "$GITHUB_WORKSPACE/seo-retest-evidence"
          git clone --quiet https://github.com/AgriciDaniel/claude-seo.git "$seo_task_dir/tool"
          git -C "$seo_task_dir/tool" checkout --quiet cca7e4a267991aca880efade1fd12e8498caf2ce
          cp tools/seo-retest/collect_evidence.py "$seo_task_dir/collect_evidence.py"
          cp tools/seo-retest/*-specialist.py "$seo_task_dir/"
          printf 'SEO_TASK_ROOT=%s\n' "$seo_task_dir" >> "$GITHUB_ENV"
          printf 'SEO_OUTPUT_ROOT=%s\n' "$GITHUB_WORKSPACE/seo-retest-evidence" >> "$GITHUB_ENV"
          printf 'CLAUDE_SEO_DATA_DIR=%s\n' "$seo_task_dir/runtime" >> "$GITHUB_ENV"
          export CLAUDE_SEO_DATA_DIR="$seo_task_dir/runtime"
          "$seo_task_dir/tool/scripts/claude-seo" setup 2>&1 | tee "$GITHUB_WORKSPACE/seo-retest-evidence/setup.log"
          "$seo_task_dir/tool/scripts/claude-seo" doctor --json > "$GITHUB_WORKSPACE/seo-retest-evidence/doctor.json"
          git -C "$seo_task_dir/tool" rev-parse HEAD > "$GITHUB_WORKSPACE/seo-retest-evidence/tool-commit.txt"
          python --version > "$GITHUB_WORKSPACE/seo-retest-evidence/python-version.txt"
      - name: Full public crawl
        id: crawl
        continue-on-error: true
        run: python "$SEO_TASK_ROOT/collect_evidence.py" '${{ matrix.site }}' --concurrency 1
      - name: Retain early crawl evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seo-crawl-${{ matrix.site }}-20261116
          path: seo-retest-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Provide CJK glyphs for browser validation
        if: steps.crawl.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match ':lang=zh' > seo-retest-evidence/cjk-font.txt
      - name: Render and specialist evidence
        if: steps.crawl.outcome == 'success'
        run: python "$SEO_TASK_ROOT/${{ matrix.site }}-specialist.py"
      - name: Retain complete evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seo-full-${{ matrix.site }}-20261116
          path: seo-retest-evidence/
          retention-days: 30
          if-no-files-found: error
